name: AlgoLearn verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: algolearn
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: algolearn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algolearn -d algolearn"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://algolearn:ci-fixture-only@127.0.0.1:5432/algolearn
      TEST_DATABASE_URL: postgresql://algolearn:ci-fixture-only@127.0.0.1:5432/algolearn_test
      PGPASSWORD: ci-fixture-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Configure isolated databases
        run: |
          node -e "require('node:fs').writeFileSync('.env', 'DATABASE_URL='+process.env.DATABASE_URL+'\nTEST_DATABASE_URL='+process.env.TEST_DATABASE_URL+'\nNODE_ENV=development\nMAIL_MODE=filesystem\nAPP_ORIGIN=http://localhost:5173\n')"
          psql -h 127.0.0.1 -U algolearn -d algolearn -c 'CREATE DATABASE algolearn_test'
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
