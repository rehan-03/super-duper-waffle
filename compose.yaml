services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: algolearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: algolearn
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - algolearn_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algolearn -d algolearn"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  algolearn_pg:
